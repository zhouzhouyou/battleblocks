name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to build and attach
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, test and package Windows x64
        run: python tools/build.py --native-only
      - name: Prepare versioned archive and checksum
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $name = "BattleBlocks-$env:RELEASE_TAG-windows-x64.zip"
          Copy-Item dist/battleblocks-win32-AMD64.zip "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content dist/SHA256SUMS-windows.txt -Encoding ascii
      - name: Attach Windows files to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG "dist/BattleBlocks-$env:RELEASE_TAG-windows-x64.zip" dist/SHA256SUMS-windows.txt --clobber
