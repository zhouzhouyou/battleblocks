# Manual only: macOS runners are expensive and review packages are produced
# locally. Pull requests use the repository-policy workflow instead.
name: Build macOS review package (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build, test and package macOS
        run: python tools/build.py --native-only
      - name: Verify the canonical headless model
        env:
          BATTLEBLOCKS_BIN: target/release/battleblocks
        run: python tools/check_headless.py
      - uses: actions/upload-artifact@v6
        with:
          name: battleblocks-macos-review
          path: |
            dist/macos-*.zip
            dist/measurements.json
          if-no-files-found: error
          retention-days: 14
