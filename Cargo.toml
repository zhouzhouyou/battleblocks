[package]
name = "battleblocks"
version = "0.1.0"
edition = "2021"
default-run = "battleblocks"

[dependencies]
macroquad = { version = "=0.4.16", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "=0.18.2"
lewton = "=0.9.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
